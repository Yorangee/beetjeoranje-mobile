<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2903D">
<title>BeetjeOranje Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="topbar-brand"><span class="topbar-brand-dot"></span>BeetjeOranje</div>
    <button type="button" class="topbar-settings-btn" id="settingsBtn" title="Instellingen">⚙</button>
  </div>

  <div class="update-banner" id="updateBanner">
    <span>Nieuwe versie beschikbaar</span>
    <button type="button" id="updateReloadBtn">Herladen</button>
  </div>

  <div id="debugBanner" style="display:none; margin:0 16px 10px; padding:12px 14px; border-radius:12px; background:#fff; border:2px solid #E0544A; color:#2B2016; font-size:12px; font-family:monospace; white-space:pre-wrap; word-break:break-word; max-height:220px; overflow-y:auto;"></div>

  <main>
    <!-- ---------- Agenda ---------- -->
    <section class="view active" data-view="agenda">
      <div class="card">
        <h2>Vandaag</h2>
        <div id="briefSummary" class="loading">Even ophalen…</div>
      </div>
      <div class="card">
        <h2>Agenda <button type="button" id="agendaRefreshBtn" style="float:right; border:none; background:rgba(242,144,61,0.14); color:var(--orange-dark); font-size:11.5px; font-weight:800; padding:5px 10px; border-radius:8px;">Ververs</button></h2>
        <div id="agendaList" class="loading">Log in met Google om je agenda te zien.</div>
      </div>
    </section>

    <!-- ---------- Taken ---------- -->
    <section class="view" data-view="taken">
      <div class="card">
        <h2>Taken</h2>
        <div id="taskList" class="loading">Voeg je Todoist-token toe via instellingen.</div>
      </div>
    </section>

    <!-- ---------- Budget ---------- -->
    <section class="view" data-view="budget">
      <div class="card">
        <h2>
          Budget
          <span style="float:right; display:flex; align-items:center; gap:6px;">
            <button type="button" id="budgetPrevBtn" class="budget-nav-arrow">‹</button>
            <span id="budgetMonthLabel" style="font-size:12.5px; font-weight:800; color:var(--muted);"></span>
            <button type="button" id="budgetNextBtn" class="budget-nav-arrow">›</button>
          </span>
        </h2>
        <div id="budgetBody" class="loading">Even ophalen…</div>
      </div>
    </section>

    <!-- ---------- Notities ---------- -->
    <section class="view" data-view="notities">
      <div class="card">
        <h2>Notities <button type="button" id="noteAddBtn" style="float:right; border:none; background:rgba(242,144,61,0.14); color:var(--orange-dark); font-size:11.5px; font-weight:800; padding:5px 10px; border-radius:8px;">+ Nieuw</button></h2>
        <div id="notesList" class="loading">Even ophalen…</div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-nav="agenda"><span class="icon">🏠</span>Agenda</button>
    <button type="button" class="nav-btn" data-nav="taken"><span class="icon">✅</span>Taken</button>
    <button type="button" class="nav-btn" data-nav="budget"><span class="icon">💶</span>Budget</button>
    <button type="button" class="nav-btn" data-nav="notities"><span class="icon">📝</span>Notities</button>
  </nav>

  <!-- ---------- Instellingen ---------- -->
  <div class="modal-overlay hidden" id="settingsOverlay">
    <div class="modal-sheet">
      <button type="button" class="modal-close" id="settingsCloseBtn">✕</button>
      <h3>Instellingen</h3>

      <div class="connection-status"><span class="connection-dot" id="googleDot"></span><span id="googleStatusText">Google: niet ingelogd</span></div>
      <button type="button" class="btn-primary" id="googleSignInBtn">Inloggen met Google</button>

      <div class="modal-field" style="margin-top:20px;">
        <label for="todoistTokenInput">Todoist API-token</label>
        <input type="password" id="todoistTokenInput" placeholder="Plak hier je persoonlijke token" autocomplete="off">
      </div>
      <button type="button" class="btn-secondary" id="todoistSaveBtn">Token opslaan</button>
    </div>
  </div>

  <!-- ---------- Notitie bewerken ---------- -->
  <div class="modal-overlay hidden" id="noteEditorOverlay">
    <div class="modal-sheet">
      <button type="button" class="modal-close" id="noteEditorCloseBtn">✕</button>
      <h3>Notitie</h3>
      <div class="modal-field">
        <label for="noteTitleInput">Titel</label>
        <input type="text" id="noteTitleInput" placeholder="Titel">
      </div>
      <div class="modal-field">
        <label for="noteCategorySelect">Categorie</label>
        <select id="noteCategorySelect"></select>
      </div>
      <div class="modal-field">
        <label for="noteBodyInput">Inhoud</label>
        <textarea id="noteBodyInput" rows="6" placeholder="Schrijf hier je notitie..."></textarea>
      </div>
      <button type="button" class="btn-primary" id="noteSaveBtn">Opslaan</button>
      <button type="button" class="btn-secondary" id="noteDeleteBtn" style="color:var(--danger);">Verwijderen</button>
    </div>
  </div>

  <!-- ---------- Budget-item toevoegen ---------- -->
  <div class="modal-overlay hidden" id="budgetItemOverlay">
    <div class="modal-sheet">
      <button type="button" class="modal-close" id="budgetItemCloseBtn">✕</button>
      <h3 id="budgetItemModalTitle">Item toevoegen</h3>
      <div class="modal-field">
        <label for="budgetItemLabelInput">Omschrijving</label>
        <input type="text" id="budgetItemLabelInput" placeholder="Bijv. Huur">
      </div>
      <div class="modal-field">
        <label for="budgetItemAmountInput">Bedrag (€)</label>
        <input type="number" step="0.01" inputmode="decimal" id="budgetItemAmountInput" placeholder="0,00">
      </div>
      <button type="button" class="btn-primary" id="budgetItemSaveBtn">Toevoegen</button>
    </div>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer id="gsiScript"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
